<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Səbət — TechStore</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .cart-page-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 36px;
      padding: 40px 0 60px;
    }
    .cart-table-card, .cart-summary-card {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .cart-items-table {
      width: 100%;
      border-collapse: collapse;
    }
    .cart-items-table th {
      text-align: left;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.88rem;
      text-transform: uppercase;
    }
    .cart-items-table td {
      padding: 18px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .cart-item-row-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .cart-item-row-info img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      background: #F8FAFC;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .summary-row.total-row {
      border-top: 1px solid var(--border-light);
      padding-top: 16px;
      margin-top: 16px;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--dark);
    }
    .coupon-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .coupon-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
    }
    @media (max-width: 992px) {
      .cart-page-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <button class="mobile-menu-toggle" aria-label="Menyu"><span></span><span></span><span></span></button>
      <a href="index.html" class="site-logo">
        <div class="logo-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <div class="logo-text">Tech<span>Store</span></div>
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Ana səhifə</a>
        <a href="shop.html" class="nav-link" data-i18n="nav_shop">Mağaza</a>
        <a href="about.html" class="nav-link" data-i18n="nav_about">Haqqımızda</a>
        <a href="contact.html" class="nav-link" data-i18n="nav_contact">Əlaqə</a>
      </nav>
      <div class="header-actions">
        <div class="lang-toggle-wrap">
          <button class="lang-btn active" data-lang="az">AZ</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a href="admin/index.html" class="action-icon-btn" title="Admin Panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Cart Content -->
  <main class="container">
    <div style="padding: 24px 0 0;">
      <h1 class="section-title" data-i18n="cart_title">Səbətiniz</h1>
    </div>

    <div class="cart-page-layout">
      <!-- Items Table -->
      <div class="cart-table-card">
        <div id="cart-table-content">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Order Summary Card -->
      <div class="cart-summary-card">
        <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 20px;">Sifariş xülasəsi</h3>

        <div class="coupon-box">
          <input type="text" id="coupon-code-input" class="coupon-input" placeholder="Promokod (məs. TECH10)">
          <button class="btn-primary" style="padding: 10px 18px;" onclick="applyCoupon()">Tətbiq et</button>
        </div>

        <div class="summary-row">
          <span>Məhsulların qiyməti:</span>
          <span id="cart-page-subtotal" style="font-weight: 700; color: var(--dark);">0,00 ₼</span>
        </div>

        <div class="summary-row">
          <span>Çatdırılma:</span>
          <span style="font-weight: 700; color: #10B981;">Pulsuz</span>
        </div>

        <div class="summary-row" id="discount-row" style="display: none; color: var(--primary);">
          <span>Endirim:</span>
          <span id="discount-amount">-0,00 ₼</span>
        </div>

        <div class="summary-row total-row">
          <span>Yekun məbləğ:</span>
          <span id="cart-page-total" style="color: var(--primary);">0,00 ₼</span>
        </div>

        <a href="checkout.html" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 24px;" data-i18n="cart_checkout">
          Sifarişi rəsmiləşdir
        </a>
        <a href="shop.html" style="display: block; text-align: center; margin-top: 14px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted);" data-i18n="continue_shopping">
          ← Alış-verişə davam et
        </a>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <a href="index.html" class="mob-nav-btn"><span data-i18n="nav_home">Ana səhifə</span></a>
    <a href="shop.html" class="mob-nav-btn"><span data-i18n="nav_shop">Mağaza</span></a>
    <a href="cart.html" class="mob-nav-btn active"><span data-i18n="cart_title">Səbət</span></a>
    <a href="admin/index.html" class="mob-nav-btn"><span>Admin</span></a>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    let discountPercent = 0;

    document.addEventListener("DOMContentLoaded", () => {
      renderCartTable();
    });

    function renderCartTable() {
      const container = document.getElementById("cart-table-content");
      const cart = window.dataStore.getCart();
      const lang = window.i18n.getLang();

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.5" style="margin: 0 auto 16px;">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <h3 style="margin-bottom: 8px;">${window.i18n.t("cart_empty")}</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Mağazaya keçərək istədiyiniz məhsulları seçə bilərsiniz.</p>
            <a href="shop.html" class="btn-primary">${window.i18n.t("continue_shopping")}</a>
          </div>
        `;
        updateTotals(0);
        return;
      }

      let subtotal = 0;
      let rows = `
        <table class="cart-items-table">
          <thead>
            <tr>
              <th>Məhsul</th>
              <th>Qiymət</th>
              <th>Say</th>
              <th>Cəm</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        const title = lang === "az" ? item.title_az : item.title_en;

        rows += `
          <tr>
            <td>
              <div class="cart-item-row-info">
                <img src="${item.image}" alt="${title}">
                <div>
                  <h4 style="font-size: 0.95rem; font-weight: 700;">${title}</h4>
                  <span style="font-size: 0.8rem; color: var(--text-muted);">${item.category}</span>
                </div>
              </div>
            </td>
            <td style="font-weight: 700;">${window.i18n.formatPrice(item.price)}</td>
            <td>
              <div class="qty-counter">
                <button class="qty-btn" onclick="updateItemQty(${item.id}, ${item.quantity - 1}); renderCartTable();">-</button>
                <span class="qty-display">${item.quantity}</span>
                <button class="qty-btn" onclick="updateItemQty(${item.id}, ${item.quantity + 1}); renderCartTable();">+</button>
              </div>
            </td>
            <td style="font-weight: 800; color: var(--primary);">${window.i18n.formatPrice(itemTotal)}</td>
            <td>
              <button onclick="removeDrawerItem(${item.id}); renderCartTable();" style="color: var(--danger); font-size: 1.2rem; cursor: pointer;">
                &times;
              </button>
            </td>
          </tr>
        `;
      });

      rows += `</tbody></table>`;
      container.innerHTML = rows;
      updateTotals(subtotal);
    }

    function updateTotals(subtotal) {
      const discount = subtotal * (discountPercent / 100);
      const total = Math.max(0, subtotal - discount);

      document.getElementById("cart-page-subtotal").textContent = window.i18n.formatPrice(subtotal);
      document.getElementById("cart-page-total").textContent = window.i18n.formatPrice(total);

      const discountRow = document.getElementById("discount-row");
      if (discountPercent > 0) {
        discountRow.style.display = "flex";
        document.getElementById("discount-amount").textContent = `-${window.i18n.formatPrice(discount)}`;
      } else {
        discountRow.style.display = "none";
      }
    }

    function applyCoupon() {
      const code = document.getElementById("coupon-code-input").value.trim().toUpperCase();
      const coupons = window.dataStore.getCoupons();
      const match = coupons.find(c => c.code === code && c.active);

      if (match) {
        discountPercent = match.value;
        showToast(`Təbriklər! ${match.value}% endirim tətbiq olundu! 🎉`);
        renderCartTable();
      } else {
        showToast("Yanlış və ya vaxtı keçmiş kupon kodu!", "error");
      }
    }
  </script>
</body>
</html>
