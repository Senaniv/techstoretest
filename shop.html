<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mağaza — TechStore</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .shop-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 36px;
      padding: 40px 0 60px;
    }
    .filter-card {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 100px;
    }
    .filter-group {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .filter-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--dark);
    }
    .filter-cat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-cat-btn {
      display: flex;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      transition: var(--transition);
    }
    .filter-cat-btn:hover, .filter-cat-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .price-range-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .price-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .shop-header-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      padding: 16px 24px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      margin-bottom: 24px;
    }
    .sort-select {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      background: #FFFFFF;
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 600;
    }
    @media (max-width: 992px) {
      .shop-layout {
        grid-template-columns: 1fr;
      }
      .filter-card {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <button class="mobile-menu-toggle" aria-label="Menyu">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="site-logo">
        <div class="logo-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <div class="logo-text">Tech<span>Store</span></div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Ana səhifə</a>
        <a href="shop.html" class="nav-link active" data-i18n="nav_shop">Mağaza</a>
        <a href="about.html" class="nav-link" data-i18n="nav_about">Haqqımızda</a>
        <a href="contact.html" class="nav-link" data-i18n="nav_contact">Əlaqə</a>
      </nav>

      <div class="header-search">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="global-search-input" data-i18n-placeholder="search_placeholder" placeholder="Məhsul axtarın...">
        </div>
        <div class="search-results-dropdown" id="search-results-box"></div>
      </div>

      <div class="header-actions">
        <div class="lang-toggle-wrap">
          <button class="lang-btn active" data-lang="az">AZ</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a href="admin/index.html" class="action-icon-btn" title="Admin Panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <a href="cart.html" class="action-icon-btn open-cart-btn" aria-label="Səbət">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="action-badge cart-count-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Shop Content -->
  <main class="container">
    <div class="shop-layout">
      
      <!-- Filter Sidebar -->
      <aside class="filter-sidebar">
        <div class="filter-card">
          <div class="filter-group">
            <h3 class="filter-title" data-i18n="filter_category">Kateqoriyalar</h3>
            <ul class="filter-cat-list" id="shop-category-filters">
              <!-- Dynamically populated -->
            </ul>
          </div>

          <div class="filter-group">
            <h3 class="filter-title" data-i18n="filter_price">Maksimum Qiymət</h3>
            <div class="price-range-inputs">
              <input type="range" id="price-range-slider" min="50" max="3000" step="50" value="3000" style="width: 100%; accent-color: var(--primary);">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px; font-weight: 700; font-size: 0.9rem; color: var(--primary);" id="price-slider-val">
              0 ₼ — 3 000 ₼
            </div>
          </div>

          <button class="btn-primary" style="width: 100%; justify-content: center; padding: 10px;" onclick="resetFilters()">
            Filtrləri sıfırla
          </button>
        </div>
      </aside>

      <!-- Products Column -->
      <div class="shop-products-column">
        <div class="shop-header-toolbar">
          <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-muted);">
            <span id="product-count-number">0</span> <span data-i18n="showing_results">məhsul tapıldı</span>
          </div>

          <div style="display: flex; align-items: center; gap: 10px;">
            <label for="sort-select" style="font-size: 0.88rem; font-weight: 600; color: var(--text-muted);" data-i18n="sort_by">Sıralama:</label>
            <select id="sort-select" class="sort-select" onchange="applyShopFilters()">
              <option value="default" data-i18n="sort_default">Varsayılan</option>
              <option value="price_asc" data-i18n="sort_price_asc">Qiymət: Ucuzdan bahaya</option>
              <option value="price_desc" data-i18n="sort_price_desc">Qiymət: Bahadan ucuza</option>
              <option value="rating" data-i18n="sort_rating">Reytinqə görə</option>
            </select>
          </div>
        </div>

        <div class="products-grid" id="shop-products-grid">
          <!-- Rendered via shop.js -->
        </div>
      </div>

    </div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-drawer-overlay" id="cart-drawer-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-head">
      <h3 data-i18n="cart_title">Səbətiniz</h3>
      <button class="close-drawer-btn">&times;</button>
    </div>
    <div class="cart-drawer-body" id="drawer-cart-list"></div>
    <div class="cart-drawer-foot">
      <div class="drawer-total-row">
        <span data-i18n="cart_total">Cəmi:</span>
        <span id="drawer-cart-total">0,00 ₼</span>
      </div>
      <a href="checkout.html" class="drawer-checkout-btn" data-i18n="cart_checkout">Sifarişi rəsmiləşdir</a>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <a href="index.html" class="mob-nav-btn"><span data-i18n="nav_home">Ana səhifə</span></a>
    <a href="shop.html" class="mob-nav-btn active"><span data-i18n="nav_shop">Mağaza</span></a>
    <a href="cart.html" class="mob-nav-btn open-cart-btn"><span data-i18n="cart_title">Səbət</span></a>
    <a href="admin/index.html" class="mob-nav-btn"><span>Admin</span></a>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activeCategory = new URLSearchParams(window.location.search).get("category") || "all";
    let maxPrice = 3000;

    document.addEventListener("DOMContentLoaded", () => {
      renderCategoryFilters();
      applyShopFilters();

      const slider = document.getElementById("price-range-slider");
      if (slider) {
        slider.addEventListener("input", (e) => {
          maxPrice = parseInt(e.target.value);
          document.getElementById("price-slider-val").textContent = `0 ₼ — ${window.i18n.formatPrice(maxPrice)}`;
          applyShopFilters();
        });
      }
    });

    function renderCategoryFilters() {
      const container = document.getElementById("shop-category-filters");
      const categories = window.dataStore.getCategories();
      const lang = window.i18n.getLang();

      let html = `
        <li>
          <button class="filter-cat-btn ${activeCategory === 'all' ? 'active' : ''}" onclick="selectCategory('all')">
            <span>${window.i18n.t('filter_all')}</span>
          </button>
        </li>
      `;

      html += categories.map(cat => {
        const name = lang === "az" ? cat.name_az : cat.name_en;
        return `
          <li>
            <button class="filter-cat-btn ${activeCategory === cat.id ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
              <span>${name}</span>
            </button>
          </li>
        `;
      }).join("");

      container.innerHTML = html;
    }

    function selectCategory(catId) {
      activeCategory = catId;
      renderCategoryFilters();
      applyShopFilters();
    }

    function resetFilters() {
      activeCategory = "all";
      maxPrice = 3000;
      document.getElementById("price-range-slider").value = 3000;
      document.getElementById("price-slider-val").textContent = "0 ₼ — 3 000 ₼";
      document.getElementById("sort-select").value = "default";
      renderCategoryFilters();
      applyShopFilters();
    }

    function applyShopFilters() {
      let products = window.dataStore.getProducts();
      const lang = window.i18n.getLang();

      if (activeCategory !== "all") {
        products = products.filter(p => p.category === activeCategory);
      }

      products = products.filter(p => p.price <= maxPrice);

      const sortBy = document.getElementById("sort-select").value;
      if (sortBy === "price_asc") {
        products.sort((a, b) => a.price - b.price);
      } else if (sortBy === "price_desc") {
        products.sort((a, b) => b.price - a.price);
      } else if (sortBy === "rating") {
        products.sort((a, b) => b.rating - a.rating);
      }

      document.getElementById("product-count-number").textContent = products.length;

      const grid = document.getElementById("shop-products-grid");
      if (products.length === 0) {
        grid.innerHTML = `<div style="grid-column: span 3; text-align: center; padding: 48px; color: var(--text-muted);">${window.i18n.t('no_products')}</div>`;
        return;
      }

      grid.innerHTML = products.map(product => {
        const title = lang === "az" ? product.title_az : product.title_en;
        const isWished = window.dataStore.isInWishlist(product.id);

        return `
          <div class="product-card">
            <div class="product-card-top">
              <span class="discount-badge">${product.discount || "-10%"}</span>
              <button class="wishlist-btn ${isWished ? 'active' : ''}" onclick="handleWishlistToggle(event, ${product.id})">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isWished ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
            </div>
            <div class="product-thumb-wrap" onclick="window.location.href='product.html?id=${product.id}'">
              <img src="${product.image}" alt="${title}">
            </div>
            <div class="product-meta">
              <h3 class="product-title" onclick="window.location.href='product.html?id=${product.id}'">${title}</h3>
              <div class="product-rating">
                <div class="stars-list">★★★★★</div>
                <span class="reviews-num">(${product.reviewsCount})</span>
              </div>
              <div class="product-price-box">
                <span class="current-price">${window.i18n.formatPrice(product.price)}</span>
                ${product.oldPrice ? `<span class="old-price">${window.i18n.formatPrice(product.oldPrice)}</span>` : ''}
              </div>
              <button class="btn-add-cart" onclick="handleAddToCart(event, ${product.id})">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-2z"></path>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span>${window.i18n.t('add_to_cart')}</span>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
